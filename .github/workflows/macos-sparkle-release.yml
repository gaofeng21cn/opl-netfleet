name: Release macOS Sparkle DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Product release tag (for example v0.9.25)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: netfleet-macos-sparkle-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    defaults:
      run:
        working-directory: source
    outputs:
      source: ${{ steps.preflight.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Verify release tag and preflight public channels
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('product-version.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
          python3 ../release-tools/scripts/macos/publish-sparkle-release.py \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --preflight desktop/app/Info.plist
          printf 'source=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare build dependencies
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v pkg-config >/dev/null || brew install pkgconf

      - name: Configure Apple Developer ID signing and notarization
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 || secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD || secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID || secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD || secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.TEAM_ID || 'SVVC4TA784' }}
          SIGNING_IDENTITY: "Developer ID Application: FENG GAO (SVVC4TA784)"
        run: |
          set -euo pipefail
          : "${BUILD_CERTIFICATE_BASE64:?Missing APPLE_DEVELOPER_ID_P12_BASE64 or BUILD_CERTIFICATE_BASE64 in release environment}"
          : "${P12_PASSWORD:?Missing APPLE_DEVELOPER_ID_P12_PASSWORD or P12_PASSWORD in release environment}"
          : "${APPLE_ID:?Missing APPLE_NOTARY_APPLE_ID or APPLE_ID in release environment}"
          : "${APPLE_ID_PASSWORD:?Missing APPLE_NOTARY_PASSWORD or APPLE_ID_PASSWORD in release environment}"
          : "${TEAM_ID:?Missing APPLE_TEAM_ID or TEAM_ID in release environment}"
          keychain="$RUNNER_TEMP/netfleet-release.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$SIGNING_IDENTITY"
          xcrun notarytool store-credentials opl-netfleet-release \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$TEAM_ID" \
            --keychain "$keychain"
          echo "NETFLEET_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, notarize DMG, and generate Sparkle appcast.xml
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SIGNING_IDENTITY: "Developer ID Application: FENG GAO (SVVC4TA784)"
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SPARKLE_ED25519_PRIVATE_KEY:?Missing SPARKLE_ED25519_PRIVATE_KEY in release environment}"
          runtime="$(python3 scripts/macos/bootstrap.py)"
          export PATH="$runtime/bin:$PATH"
          export UCODE_LIB="$runtime/lib/ucode/*.so"
          export NETFLEET_RUNTIME_ROOT="$runtime"

          APP_PATH=".build/macos/OPL NetFleet.app"
          DMG_PATH="dist/OPL-NetFleet-macos-arm64.dmg"
          mkdir -p dist

          python3 scripts/macos/build-app.py \
            --require-clean-source \
            --signing-identity "$SIGNING_IDENTITY" \
            --output "$APP_PATH"
          scripts/macos/verify-sparkle-contract.sh "$APP_PATH"

          ditto -c -k --keepParent "$APP_PATH" ".build/macos/notarization.zip"
          xcrun notarytool submit ".build/macos/notarization.zip" \
            --keychain-profile opl-netfleet-release \
            --keychain "$NETFLEET_NOTARY_KEYCHAIN" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

          python3 scripts/macos/package-dmg.py \
            --app "$APP_PATH" \
            --output "$DMG_PATH" \
            --signing-identity "$SIGNING_IDENTITY"
          xcrun notarytool submit "$DMG_PATH" \
            --keychain-profile opl-netfleet-release \
            --keychain "$NETFLEET_NOTARY_KEYCHAIN" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"

          (cd dist && shasum -a 256 OPL-NetFleet-macos-arm64.dmg > OPL-NetFleet-macos-arm64.dmg.sha256)

          OPL_NETFLEET_RELEASE_TAG="$RELEASE_TAG" \
          OPL_NETFLEET_APP_PATH="$APP_PATH" \
          OPL_NETFLEET_REQUIRE_SPARKLE_KEY_ENV=1 \
            scripts/macos/generate-appcast.sh "$DMG_PATH" "dist/appcast.xml"

      - name: Preserve sealed macOS artifacts for an exact-byte retry
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: netfleet-macos-${{ inputs.release_tag }}
          path: |
            source/dist/OPL-NetFleet-macos-arm64.dmg
            source/dist/OPL-NetFleet-macos-arm64.dmg.sha256
            source/dist/appcast.xml
          if-no-files-found: error
          compression-level: 0

      - name: Remove temporary Apple credentials
        if: always()
        run: |
          if [[ -n "${NETFLEET_NOTARY_KEYCHAIN:-}" ]]; then
            security delete-keychain "$NETFLEET_NOTARY_KEYCHAIN" || true
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: netfleet-macos-${{ inputs.release_tag }}
          path: dist
      - name: Publish versioned macOS assets and advance the stable appcast
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SOURCE: ${{ needs.build.outputs.source }}
        run: |
          python3 scripts/macos/publish-sparkle-release.py \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --artifacts dist

name: NetFleet package candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing branch, tag, or commit to package
        required: true
        default: main
        type: string
      sdk_url:
        description: OpenWrt SDK archive URL for the target architecture
        required: true
        type: string
      sdk_sha256:
        description: SHA-256 of the SDK archive
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: netfleet-package-candidate-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Resolve checked-out source identity
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          source_commit=$(git rev-parse 'HEAD^{commit}')
          source_tree=$(git rev-parse 'HEAD^{tree}')
          printf 'NETFLEET_SOURCE_COMMIT=%s\n' "$source_commit" >> "$GITHUB_ENV"
          printf 'NETFLEET_SOURCE_TREE=%s\n' "$source_tree" >> "$GITHUB_ENV"

      - name: Restore pinned OpenWrt SDK archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk.tar
          key: netfleet-openwrt-sdk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.sdk_sha256 }}

      - name: Download and verify SDK
        env:
          SDK_URL: ${{ inputs.sdk_url }}
          SDK_SHA256: ${{ inputs.sdk_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/netfleet-sdk" "$RUNNER_TEMP/netfleet-output"
          if [ ! -f "$RUNNER_TEMP/sdk.tar" ]; then
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/sdk.tar" "$SDK_URL"
          fi
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/sdk.tar" | sha256sum --check --status
          tar -xf "$RUNNER_TEMP/sdk.tar" -C "$RUNNER_TEMP/netfleet-sdk"
          sdk_makefile=$(find "$RUNNER_TEMP/netfleet-sdk" -mindepth 1 -maxdepth 2 -type f -name Makefile -print -quit)
          test -n "$sdk_makefile"
          sdk=${sdk_makefile%/Makefile}
          scripts/prepare-openwrt-sdk.sh --sdk "$sdk"
          printf 'NETFLEET_SDK=%s\n' "$sdk" >> "$GITHUB_ENV"

      - name: Build signed package set
        env:
          NETFLEET_APK_PRIVATE_KEY: ${{ secrets.NETFLEET_APK_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/netfleet-apk-private.pem"
          if [ -n "$NETFLEET_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$NETFLEET_APK_PRIVATE_KEY" > "$key"
          fi
          args=(--sdk "$NETFLEET_SDK" --ref "$NETFLEET_SOURCE_COMMIT" --output "$RUNNER_TEMP/netfleet-output")
          if [ -s "$key" ]; then args+=(--apk-private-key "$key"); fi
          scripts/netfleet-package-build.sh "${args[@]}"

      - name: Verify built package identity
        run: |
          test -s "$RUNNER_TEMP/netfleet-output/packages.adb"
          scripts/verify-netfleet-release.py \
            --directory "$RUNNER_TEMP/netfleet-output" \
            --source-commit "$NETFLEET_SOURCE_COMMIT" \
            --source-tree "$NETFLEET_SOURCE_TREE"

      - name: Upload candidate for ARM64 VM qualification
        uses: actions/upload-artifact@v4
        with:
          name: netfleet-openwrt-candidate-${{ env.NETFLEET_SOURCE_COMMIT }}
          path: ${{ runner.temp }}/netfleet-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Report candidate identity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("${{ runner.temp }}/netfleet-output/manifest.json").read_text())
          print(json.dumps({
              "candidate": True,
              "source_commit": manifest["source_commit"],
              "source_tree": manifest["source_tree"],
              "package_version": manifest["package_version"],
              "package_arch": manifest["package_arch"],
              "build_target_arch": manifest["build_target_arch"],
          }, sort_keys=True))
          PY
